<style>
html,body{margin:0;background:#ffffff}
a{color:#464742;text-decoration:none}a:hover{color:#5d5e58}
.kw{--ink:#464742;--graphite:#5d5e58;--hand:#464742;--display:'Barlow','Helvetica Neue',Arial,sans-serif;position:relative;min-height:100vh;font-family:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;color:var(--ink);-webkit-font-smoothing:antialiased}
.kw *{box-sizing:border-box}

.kw-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.kw-bg span{position:absolute;border-radius:50%;will-change:transform}

.kw-bg .b4{width:60vmax;height:60vmax;right:-10vmax;top:-25vmax;background:radial-gradient(closest-side,rgba(194,201,216,.6),rgba(194,201,216,0));animation:kwB4 83s ease-in-out infinite alternate}
.kw-bg .b5{width:55vmax;height:55vmax;left:-15vmax;bottom:-30vmax;background:radial-gradient(closest-side,rgba(215,195,192,.5),rgba(215,195,192,0));animation:kwB5 64s ease-in-out infinite alternate}
.kw.bg-paper .kw-bg .b1{background:radial-gradient(closest-side,rgba(206,204,199,.65),rgba(206,204,199,0))}
.kw.bg-paper .kw-bg .b2{background:radial-gradient(closest-side,rgba(228,226,222,.7),rgba(228,226,222,0))}
.kw.bg-paper .kw-bg .b3{background:radial-gradient(closest-side,rgba(246,245,243,.9),rgba(246,245,243,0))}
.kw.bg-paper .kw-bg .b4{background:radial-gradient(closest-side,rgba(198,197,194,.45),rgba(198,197,194,0))}
.kw.bg-paper .kw-bg .b5{background:radial-gradient(closest-side,rgba(218,215,211,.55),rgba(218,215,211,0))}

.kw.bg-stone .kw-bg .b1{background:radial-gradient(closest-side,rgba(200,194,187,.65),rgba(200,194,187,0))}
.kw.bg-stone .kw-bg .b2{background:radial-gradient(closest-side,rgba(222,214,209,.6),rgba(222,214,209,0))}
.kw.bg-stone .kw-bg .b3{background:radial-gradient(closest-side,rgba(244,242,238,.9),rgba(244,242,238,0))}

.kw.bg-stone .kw-bg .b5{background:radial-gradient(closest-side,rgba(213,207,200,.55),rgba(213,207,200,0))}
.kw.bg-mist .kw-bg .b1{background:radial-gradient(closest-side,rgba(220,221,222,.6),rgba(220,221,222,0))}
.kw.bg-mist .kw-bg .b2{background:radial-gradient(closest-side,rgba(230,230,229,.6),rgba(230,230,229,0))}
.kw.bg-mist .kw-bg .b3{background:radial-gradient(closest-side,rgba(251,251,250,.9),rgba(251,251,250,0))}
.kw.bg-mist .kw-bg .b4{background:radial-gradient(closest-side,rgba(212,213,215,.4),rgba(212,213,215,0))}
.kw.bg-mist .kw-bg .b5{background:radial-gradient(closest-side,rgba(236,236,235,.6),rgba(236,236,235,0))}
.kw.bg-paper-green .kw-bg .b1{background:radial-gradient(closest-side,rgba(199,207,198,.62),rgba(199,207,198,0))}
.kw.bg-paper-green .kw-bg .b2{background:radial-gradient(closest-side,rgba(224,228,220,.7),rgba(224,228,220,0))}
.kw.bg-paper-green .kw-bg .b3{background:radial-gradient(closest-side,rgba(246,247,243,.9),rgba(246,247,243,0))}

@keyframes kwB1{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(18vw,14vh,0) scale(1.15)}}
@keyframes kwB2{from{transform:translate3d(0,0,0) scale(1.1)}to{transform:translate3d(-22vw,-16vh,0) scale(.95)}}
@keyframes kwB3{from{transform:translate3d(0,0,0) scale(.9)}to{transform:translate3d(-16vw,20vh,0) scale(1.2)}}
@keyframes kwB4{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-26vw,22vh,0) scale(1.2)}}
@keyframes kwB5{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(24vw,-12vh,0) scale(1.18)}}

.kw.bg-print .kw-bg span{display:none}
.kw.bg-offwhite .kw-bg{background:none}
.kw.bg-offwhite .kw-bg span{display:none}
.kw .kw-type{font-family:var(--display);font-weight:600;letter-spacing:.07em;text-transform:uppercase;text-shadow:0 0 .3px currentColor}
.kw-paper{position:fixed;inset:0;z-index:1;pointer-events:none;background:url(img/paper-a.png) 0 0/395px 220px repeat,url(img/paper-b.png) 173px 97px/337px 187.6px repeat;background-blend-mode:multiply;mix-blend-mode:multiply}
.kw-in{position:relative;z-index:2}

.kw-nav{position:fixed;top:0;left:0;right:0;height:72px;display:flex;justify-content:center;align-items:center;gap:30px;z-index:7}
.kw .kw-link{position:relative;display:block;height:44px;padding:0 6px;font-family:var(--display);font-weight:600;font-size:13px;line-height:44px;letter-spacing:.09em;text-transform:uppercase;color:#6a6b65;text-shadow:0 0 .3px currentColor;filter:url(#kwtypeS);transition:color .2s ease}
.kw .kw-link:hover,.kw .kw-link.is-active{color:var(--ink)}

.kw-page{position:relative;height:100vh;min-height:620px;overflow:hidden}
.kw-thumbs{position:absolute;left:50%;top:56%;width:0;height:clamp(120px,20vh,200px);transform:translateY(-50%);animation:kwThumb 1.1s cubic-bezier(.2,.7,.2,1) both}
@keyframes kwThumb{from{opacity:0;filter:blur(6px)}to{opacity:1;filter:blur(0)}}
.kw-thumb{position:absolute;left:0;top:0;height:100%;transform:translateX(-50%);opacity:0;transition:opacity .45s ease}
.kw-thumb.is-cur{opacity:1}
.kw-thumb img{display:block;height:100%;width:auto}
.kw-thumb .kw-ph{display:block;height:100%;background:rgba(108,116,124,.22)}
.kw-list{position:absolute;left:50%;bottom:clamp(30px,5vh,56px);transform:translateX(-50%);width:max-content;max-width:calc(100vw - 32px);margin:0;padding:0;list-style:none;display:flex;flex-direction:column;align-items:center;animation:kwList 1.2s ease .2s both}
@keyframes kwList{from{opacity:0;filter:blur(4px)}to{opacity:1;filter:blur(0)}}
.kw .kw-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:baseline;gap:0 .8em;padding:5px 8px;font-family:var(--display);font-weight:600;font-size:clamp(14px,1.18vw,18px);line-height:1.22;letter-spacing:.07em;text-transform:uppercase;color:#7a7b74;transition:color .3s ease}
.kw .kw-row span{text-shadow:0 0 .3px currentColor;filter:url(#kwtypeL)}
.kw .kw-row.is-cur{color:var(--hand)}

@media (max-width:720px){.kw-nav{height:60px;gap:18px}.kw .kw-row{min-height:44px;align-items:center}.kw .kw-row span + span{display:none}.kw-thumbs{top:40%}}
@media (prefers-reduced-motion: reduce){.kw-bg span{animation:none}}
</style>
</head>

<script>
(function () {
  var rows = document.querySelectorAll('.kw-row'), thumbs = document.querySelectorAll('.kw-thumb');
  function show(i) {
    rows.forEach(function (r, j) { r.classList.toggle('is-cur', j === i); });
    thumbs.forEach(function (t, j) { t.classList.toggle('is-cur', j === i); });
  }
  rows.forEach(function (r, i) {
    r.addEventListener('mouseenter', function () { show(i); });
    r.addEventListener('focus', function () { show(i); });
  });
})();
</script>
